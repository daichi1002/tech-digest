name: Collect candidates

# The Claude Code routine's sandbox cannot reach news sites, so collection runs here.
# GitHub cron is best-effort (runs can be late or dropped, especially on the hour), so it is scheduled
# four times off the hour (05:23 / 05:53 / 06:23 / 08:23 JST). Later runs exit early once today's candidates exist.
# The routine curates at 07:30 JST from work/candidates.json, and retries at 10:30 JST if they were late.
on:
  schedule:
    - cron: "23 20 * * *"
    - cron: "53 20 * * *"
    - cron: "23 21 * * *"
    - cron: "23 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip if today's candidates are already committed
        id: today
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          have=$(python3 -c "import json; print(json.load(open('work/candidates.json'))['date'])" 2>/dev/null || true)
          if [ "$have" = "$today" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Candidates for $today already exist; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.today.outputs.skip != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.today.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - if: steps.today.outputs.skip != 'true'
        run: python -m collector.main collect
      - if: steps.today.outputs.skip != 'true'
        name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/candidates.json
          git diff --cached --quiet || git commit -m "candidates: $(TZ=Asia/Tokyo date +%F)"
          git push
