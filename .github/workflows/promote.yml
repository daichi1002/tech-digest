name: Promote digest

# The curation routine cannot push to main (main is a protected branch, and Claude Code rejects pushes
# to protected branches), so it pushes each digest to claude/data-YYYY-MM-DD instead.
# This workflow always runs the trusted copy from main, never code from the data branch:
# - pull_request_target: the routine opens a PR from its data branch; this event always uses main's
#   workflow file, and the job never checks out or executes PR code (it only copies JSON files).
# - schedule / manual dispatch: fallback when no PR was opened (GitHub cron is best-effort).
# It takes ONLY site/data/*.json from those branches, validates them with main's scripts/check_data.py,
# commits them to main, deletes the branch (which closes its PR), then dispatches deploy.yml.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]
  schedule:
    - cron: "4-59/10 22,23 * * *" # fallback every 10 min, 07:04–08:54 JST
  workflow_dispatch:

permissions:
  contents: write # commit to main, delete promoted branches
  actions: write  # dispatch deploy.yml (pushes made with GITHUB_TOKEN do not trigger workflows)

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    # For PR events, only same-repo PRs from data branches (never forks).
    if: >-
      github.event_name != 'pull_request_target' ||
      (startsWith(github.head_ref, 'claude/data-') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Promote data branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin '+refs/heads/claude/data-*:refs/remotes/origin/claude/data-*' || true
          branches=$(git for-each-ref --format='%(refname:lstrip=3)' 'refs/remotes/origin/claude/data-*')
          if [ -z "$branches" ]; then echo "Nothing to promote."; exit 0; fi

          promoted=0
          failed=0
          for b in $branches; do
            echo "::group::$b"
            if ! printf '%s' "$b" | grep -Eq '^claude/data-[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "::warning::Ignoring unexpected branch name: $b"; echo "::endgroup::"; continue
            fi
            base=$(git merge-base origin/main "origin/$b")
            # Only added/modified digest files are allowed; deletions, renames, or anything else block promotion.
            changed=$(git diff --name-only --diff-filter=AM "$base" "origin/$b")
            other=$(git diff --name-only --diff-filter=am "$base" "origin/$b")
            bad=$( { printf '%s\n' "$other"; printf '%s\n' "$changed" | grep -Ev '^site/data/([0-9]{4}-[0-9]{2}-[0-9]{2}|index)\.json$'; } | grep -v '^$' || true)
            if [ -n "$bad" ]; then
              echo "::error::$b changes files outside site/data; not promoted (branch kept for inspection):"
              echo "$bad"
              failed=1; echo "::endgroup::"; continue
            fi
            files=$(printf '%s\n' "$changed" | grep -v '^$' || true)
            if [ -z "$files" ]; then
              echo "No data changes; deleting branch."
              git push --quiet origin --delete "$b"; echo "::endgroup::"; continue
            fi

            # Copy only the allowed JSON files onto main, then validate with main's own checker.
            git checkout "origin/$b" -- $files
            if ! python scripts/check_data.py digests; then
              echo "::error::$b failed data validation; not promoted (branch kept for inspection)."
              git reset --quiet --hard HEAD
              failed=1; echo "::endgroup::"; continue
            fi
            git add -- $files
            git commit --quiet -m "data: ${b#claude/data-}" -m "Promoted from $b by promote.yml."
            git push --quiet origin HEAD:main
            git push --quiet origin --delete "$b"
            promoted=1
            echo "::endgroup::"
          done

          if [ "$promoted" = 1 ]; then gh workflow run deploy.yml --ref main; fi
          exit "$failed"
