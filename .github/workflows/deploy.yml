name: Deploy site

# Data is committed daily by the Claude Code routine (see CURATE.md); this only publishes site/.
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:
    inputs:
      notify:
        description: "Send the push notification after deploying"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    # The routine that writes "data:" commits reads untrusted third-party text, so its pushes are checked
    # before anything is deployed or run with secrets. The path check is inline (not a repo script) so a
    # data commit cannot weaken it; once it passes, scripts/ is unchanged and safe to run.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Data commits may only change site/data/*.json
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'data:')
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")  # fails the step if BEFORE is unknown
          bad=$(printf '%s\n' "$changed" | grep -Ev '^site/data/([0-9]{4}-[0-9]{2}-[0-9]{2}|index)\.json$' || true)
          if [ -n "$bad" ]; then
            echo "::error::data commit touches files outside site/data:"
            echo "$bad"
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check_data.py digests

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  notify:
    # Only after the routine publishes a new digest (commit message "data: YYYY-MM-DD").
    needs: deploy
    if: (github.event_name == 'workflow_dispatch' && inputs.notify) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'data:'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "pywebpush==2.5.0"
      - run: python scripts/send_push.py
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
