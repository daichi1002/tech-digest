name: Deploy site

# Data is committed daily by the Claude Code routine (see CURATE.md); this only publishes site/.
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    # The routine that writes "data:" commits reads untrusted third-party text, so its pushes are checked
    # before anything is deployed or run with secrets. The path check is inline (not a repo script) so a
    # data commit cannot weaken it; once it passes, scripts/ is unchanged and safe to run.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Data commits may only change site/data/*.json
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'data:')
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")  # fails the step if BEFORE is unknown
          bad=$(printf '%s\n' "$changed" | grep -Ev '^site/data/([0-9]{4}-[0-9]{2}-[0-9]{2}|index)\.json$' || true)
          if [ -n "$bad" ]; then
            echo "::error::data commit touches files outside site/data:"
            echo "$bad"
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/check_data.py digests

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  notify:
    # Only after the routine publishes a new digest (commit message "data: YYYY-MM-DD").
    needs: deploy
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'data:'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install "pywebpush==2.5.0"
      - run: python scripts/send_push.py
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
