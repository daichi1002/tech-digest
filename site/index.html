<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tech Digest">
  <title>Tech Digest</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <h1>Tech Digest</h1>
        <div class="brand-actions">
          <button id="pushBtn" class="icon-btn" type="button" title="毎朝の通知" aria-label="毎朝の通知">🔔</button>
          <select id="date" aria-label="日付"></select>
        </div>
      </div>
      <p id="headline" class="headline"></p>
      <div class="controls">
        <div id="views" class="seg" role="tablist" aria-label="表示">
          <button role="tab" data-view="all">すべて</button>
          <button role="tab" data-view="unread">未読</button>
          <button role="tab" data-view="saved">保存済み</button>
        </div>
        <div id="cats" class="chips" role="group" aria-label="カテゴリ"></div>
        <div class="row">
          <input id="q" type="search" placeholder="キーワード検索">
          <label class="score">重要度 <output id="minOut">1</output>+
            <input id="min" type="range" min="1" max="10" value="1">
          </label>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="meta-row">
      <p id="meta" class="meta"></p>
      <button id="markAll" class="text-btn" type="button">表示中をすべて既読</button>
    </div>
    <ol id="list" class="list"></ol>
    <p id="empty" class="empty" hidden>該当なし</p>
  </main>

  <dialog id="pushDlg">
    <form method="dialog" class="dlg">
      <h2>毎朝の通知</h2>
      <div id="pushBody"></div>
      <div class="dlg-actions"><button class="text-btn" value="close">閉じる</button></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
