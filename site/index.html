<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Tech Digest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <h1>Tech Digest</h1>
        <select id="date" aria-label="日付"></select>
      </div>
      <p id="headline" class="headline"></p>
      <div class="controls">
        <div id="cats" class="chips" role="group" aria-label="カテゴリ"></div>
        <div class="row">
          <input id="q" type="search" placeholder="キーワード検索">
          <label class="score">重要度 <output id="minOut">1</output>+
            <input id="min" type="range" min="1" max="10" value="1">
          </label>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p id="meta" class="meta"></p>
    <ol id="list" class="list"></ol>
    <p id="empty" class="empty" hidden>該当なし</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
